services:
  ai_smart_generation_v5.0.1.1.2:
    image: vgvalcontainer.azurecr.io/context-generation:2.0.21
    container_name: ai_smart_generation-v5.0.1.1.2
    platform: linux/amd64
    env_file:
      - ./.env
    volumes:
      - /AI-DATA:/mnt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "200m"
        max-file: "5"
    networks:
      - ai_net

  ai_smart_generation_worker_v5.0.1.1.2:
    image: vgvalcontainer.azurecr.io/context-generation-worker:2.0.3
    container_name: ai_smart_generation_worker-v5.0.1.1.2
    platform: linux/amd64
    env_file:
      - ./.env
    volumes:
      - /AI-DATA:/mnt
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "200m"
        max-file: "5"
    networks:
      - ai_net

networks:
  ai_net:
    name: ai_net
    external: true
