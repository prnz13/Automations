name: Deploy AI Services

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Select environment
        required: true
        type: choice
        options:
          - dev
          - val
          - prd

permissions:
  contents: read

concurrency:
  group: ai-deploy-${{ inputs.environment }}
  cancel-in-progress: false

# A workflow run is made up of one or more jobs

jobs:
  build-and-run:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest



    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Deployment steps described below go here.
