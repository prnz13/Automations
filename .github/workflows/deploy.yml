# Only the five release locations are read from vars.NGINX_CONF_CONTENT.
# Readiness URLs intentionally retain the supplied dotted version paths.
# DronaAKS is not included: its Compose file has not been supplied.
name: Deploy VLMS to Azure Ubuntu
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: vlms-azure-v50112
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      ACR_NAME: ${{ secrets.ACR_NAME }}
      SOURCE_DIR: deployments/v5.0.1.1.2
      DEPLOY_DIR: /home/vgadmin/VLMS/v5.0.1.1.2
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Validate files and settings
      shell: bash
      run: |
        set -euo pipefail
        for name in SSH_HOST SSH_PORT ACR_NAME; do
          test -n "${!name}" || { echo "Missing setting: $name"; exit 1; }
        done
        [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
        [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
        (( 10#$SSH_PORT >= 1 && 10#$SSH_PORT <= 65535 ))
        [[ "$ACR_NAME" =~ ^[a-zA-Z0-9]+$ ]]
        for file in ai-start.sh content-generation-docker-compose.yaml execution-assisstant-docker-compose.yaml ingestion-docker-compose.yaml sga-docker-compose.yaml smart-generation-docker-compose.yaml; do
          test -f "$SOURCE_DIR/$file" || { echo "Missing: $SOURCE_DIR/$file"; exit 1; }
        done
        bash -n "$SOURCE_DIR/ai-start.sh"
    - name: Configure SSH
      shell: bash
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      run: |
        set -euo pipefail
        umask 077
        test -n "$SSH_PRIVATE_KEY" || { echo 'Missing SSH_PRIVATE_KEY'; exit 1; }
        test -n "$SSH_KNOWN_HOSTS" || { echo 'Missing SSH_KNOWN_HOSTS'; exit 1; }
        mkdir -p "$HOME/.ssh"
        printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
        printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
        cat > "$HOME/.ssh/config" <<EOF
        Host vlms-target
          HostName $SSH_HOST
          User vgadmin
          Port $SSH_PORT
          IdentityFile $HOME/.ssh/deploy_key
          IdentitiesOnly yes
          BatchMode yes
          StrictHostKeyChecking yes
          ConnectTimeout 20
          ServerAliveInterval 30
          ServerAliveCountMax 6
        EOF
    - name: Check server prerequisites
      shell: bash
      run: |
        set -euo pipefail
        ssh vlms-target 'bash -se' <<'REMOTE'
        set -euo pipefail
        for executable in az docker rsync python3 curl flock; do
          command -v "$executable" >/dev/null || { echo "Missing executable: $executable"; exit 1; }
        done
        docker compose version
        docker info >/dev/null
        docker network inspect ai_net >/dev/null
        test -d /AI-DATA
        test -f /home/vgadmin/Common-AI/nginx/nginx.conf
        test -w /home/vgadmin/Common-AI/nginx/nginx.conf
        [ "$(docker inspect --format '{{.State.Running}}' ai_nginx)" = true ]
        docker inspect --format '{{json .NetworkSettings.Networks}}' ai_nginx |
          python3 -c 'import json,sys; assert "ai_net" in json.load(sys.stdin), "ai_nginx must be connected to ai_net"'
        docker exec ai_nginx sh -c 'command -v getent >/dev/null'
        docker exec ai_nginx nginx -t
        mkdir -p /home/vgadmin/VLMS/v5.0.1.1.2
        REMOTE
    - name: Authenticate Azure using VGUSTESTAI service principal
      shell: bash
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      run: |
        set -euo pipefail
        for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_CLIENT_SECRET; do
          test -n "${!name}" || { echo "Missing GitHub secret: $name"; exit 1; }
        done
        # Serialize credentials as data and transfer through encrypted SSH stdin.
        # The display name VGUSTESTAI is not used as the login username.
        python3 -c 'import json, os; print(json.dumps({key: os.environ[key] for key in ("AZURE_CLIENT_ID", "AZURE_TENANT_ID", "AZURE_CLIENT_SECRET")}))' |
          ssh vlms-target 'python3 -c '"'"'import json, subprocess, sys
        credentials = json.load(sys.stdin)
        result = subprocess.run([
            "az", "login", "--service-principal",
            "--username=" + credentials["AZURE_CLIENT_ID"],
            "--password=" + credentials["AZURE_CLIENT_SECRET"],
            "--tenant=" + credentials["AZURE_TENANT_ID"],
            "--allow-no-subscriptions", "--output", "none"
        ], stdin=subprocess.DEVNULL)
        # Avoid exception tracebacks that would include the credential arguments.
        sys.exit(result.returncode)
        '"'"''
        echo 'Service-principal Azure login completed on the Ubuntu server.'
    - name: Copy deployment files
      shell: bash
      run: |
        set -euo pipefail
        rsync -az --exclude='.env' --exclude='.env.*' \
          "$SOURCE_DIR/" "vlms-target:$DEPLOY_DIR/"
    - name: Create .env from GitHub Secrets
      shell: bash
      env:
        ENV_CONTENT: ${{ secrets.VLMS_ENV_FILE }}
      run: |
        set -euo pipefail
        test -n "$ENV_CONTENT" || { echo "Missing VLMS_ENV_FILE secret"; exit 1; }
        printf '%s\n' "$ENV_CONTENT" |
          ssh vlms-target 'python3 -c '"'"'import os, sys, tempfile
        from pathlib import Path
        os.umask(0o077)
        target = Path("/home/vgadmin/VLMS/v5.0.1.1.2/.env")
        data = sys.stdin.buffer.read()
        if not data.strip():
            raise SystemExit("Empty .env")
        fd, temporary = tempfile.mkstemp(prefix=".env.", dir=target.parent)
        try:
            with os.fdopen(fd, "wb") as stream:
                stream.write(data)
            os.chmod(temporary, 0o600)
            os.replace(temporary, target)
        finally:
            if os.path.exists(temporary):
                os.unlink(temporary)
        '"'"''
        echo '.env transferred with permissions 600.'
    - name: Transfer Nginx location blocks from GitHub Variables
      shell: bash
      env:
        NGINX_CONF_CONTENT: ${{ vars.NGINX_CONF_CONTENT }}
      run: |
        set -euo pipefail
        test -n "$NGINX_CONF_CONTENT" || { echo 'Missing repository variable: NGINX_CONF_CONTENT'; exit 1; }
        # Pass configuration as data: Nginx $variables remain literal.
        printf '%s\n' "$NGINX_CONF_CONTENT" |
          ssh vlms-target 'python3 -c '"'"'import os, sys, tempfile
        from pathlib import Path
        os.umask(0o077)
        target = Path("/home/vgadmin/VLMS/v5.0.1.1.2/.nginx-config.pending")
        data = sys.stdin.buffer.read()
        if not data.strip():
            raise SystemExit("NGINX_CONF_CONTENT is empty")
        fd, temporary = tempfile.mkstemp(prefix=".nginx-config.", dir=target.parent)
        try:
            with os.fdopen(fd, "wb") as stream:
                stream.write(data)
            os.replace(temporary, target)
        finally:
            if os.path.exists(temporary):
                os.unlink(temporary)
        '"'"''
        echo 'Nginx location blocks transferred from GitHub Variables.'
    - name: Deploy, update Nginx, and verify readiness
      shell: bash
      run: |
        set -euo pipefail
        # ACR_NAME was validated before it is passed to the remote shell.
        ssh vlms-target "bash -se -- '$ACR_NAME'" <<'REMOTE'
        set -Eeuo pipefail
        umask 077
        cd /home/vgadmin/VLMS/v5.0.1.1.2
        exec 9>.deployment.lock
        flock -n 9 || { echo 'Another deployment is active.'; exit 1; }

        NGINX_CONTAINER=ai_nginx
        NGINX_CONF=/home/vgadmin/Common-AI/nginx/nginx.conf
        backup="${NGINX_CONF}.backup.$(date -u +%Y%m%dT%H%M%SZ).$$"
        candidate=$(mktemp)
        containers_plan=$(mktemp)
        changed=false

        cleanup() { rm -f "$candidate" "$containers_plan"; }
        recover() {
          result=$?
          trap - ERR
          if "$changed"; then
            echo 'Deployment failed. Restoring previous Nginx configuration.'
            # Write in place: this configuration is a single-file bind mount.
            if cat "$backup" > "$NGINX_CONF"; then
              if docker restart "$NGINX_CONTAINER" >/dev/null; then
                echo 'Previous Nginx configuration restored and restart requested.'
              else
                echo "ERROR: Nginx recovery restart failed. Backup: $backup"
              fi
            else
              echo "ERROR: Cannot restore Nginx configuration. Backup: $backup"
            fi
          fi
          echo 'Application containers and .env are not rolled back.'
          exit "$result"
        }
        trap cleanup EXIT
        trap recover ERR

        test -s .env
        find . -type f -name '*.sh' -exec chmod +x {} +
        bash -n ai-start.sh
        # Azure login was completed by the service-principal step.
        az acr login --name "$1"

        # Phase 1: Validate all Compose files and record every configured service.
        projects=(ai-service-cg-v50112 ai-service-ea-v50112 ai-service-ing-v50112 ai-service-sga-v50112 ai-service-sg-v50112)
        files=(content-generation-docker-compose.yaml execution-assisstant-docker-compose.yaml ingestion-docker-compose.yaml sga-docker-compose.yaml smart-generation-docker-compose.yaml)
        for i in "${!files[@]}"; do
          docker compose --env-file .env -p "${projects[$i]}" -f "${files[$i]}" config --quiet
          docker compose --env-file .env -p "${projects[$i]}" -f "${files[$i]}" config --format json |
            python3 -c 'import json, sys
        project = sys.argv[1]
        services = json.load(sys.stdin).get("services", {})
        if not services:
            raise SystemExit("No services found: " + project)
        for service, config in services.items():
            container = config.get("container_name")
            image = config.get("image")
            if not container or not image:
                raise SystemExit("Every deployed service must define container_name and image: " + service)
            if config.get("profiles"):
                raise SystemExit("Profile-specific services need explicit deployment configuration: " + service)
            print("\t".join((project, service, container, image)))' "${projects[$i]}" >> "$containers_plan"
        done
        
        # Phase 2: Finish ALL image downloads/extraction before starting deployment.
        # A failed pull stops the job; no new Nginx configuration is applied.
        for i in "${!files[@]}"; do
          echo "Pulling all images for ${files[$i]}"
          docker compose --env-file .env -p "${projects[$i]}" -f "${files[$i]}" pull
          echo "Image download completed: ${files[$i]}"
        done
        
        # Phase 3: Run the existing entrypoint with mandatory fail-fast behavior.
        # An internal Compose failure must not be hidden by later successful commands.
        echo 'All image pulls completed. Starting application containers.'
        bash -e -o pipefail ./ai-start.sh
        
        # Phase 4: Verify configured services and release upstream DNS.
        # Only ai_ingestion-v5.0.1.1.2 may restart while Key Vault is being updated.
        # Missing ingestion, wrong images, and other service failures still block deployment.
        # Docker Health status remains ignored.
        # Up to 180 seconds are allowed for startup/Docker DNS; Nginx is unchanged here.
        test -s .nginx-config.pending || { echo 'Staged NGINX_CONF_CONTENT is missing.'; false; }
        python3 - "$containers_plan" .nginx-config.pending <<'STARTUP_PY'
        import json
        import re
        import subprocess
        import sys
        import time
        from pathlib import Path
        
        plan_path, nginx_fragment = map(Path, sys.argv[1:])
        rows = [line.split('\t') for line in plan_path.read_text().splitlines() if line]
        if not rows:
            raise SystemExit('No application services found in the Compose deployment plan.')
        
        # Snapshot the image IDs that are now present locally after every pull succeeded.
        expected = []
        for project, service, container, image in rows:
            result = subprocess.run(
                ['docker', 'image', 'inspect', '--format', '{{.Id}}', image],
                capture_output=True, text=True,
            )
            if result.returncode != 0 or not result.stdout.strip():
                raise SystemExit('Downloaded image is missing locally: ' + image)
            expected.append((project, service, container, result.stdout.strip()))
        
        upstreams = sorted(set(re.findall(
            r'\bproxy_pass\s+https?://([A-Za-z0-9_.-]+)(?=[:/;\s])',
            re.sub(r'#[^\n]*', '', nginx_fragment.read_text()),
        )))
        if not upstreams:
            raise SystemExit('No upstream hostnames found in the Nginx location fragment.')
        
        # This is a startup/network check, not a Docker HEALTHCHECK gate.
        # Require three consecutive successful samples before Nginx can be changed.
        deadline = time.monotonic() + 180
        stable_samples = 0
        last_issues = None
        reported_ingestion_restart = False
        while True:
            issues = []
            allowed_restarting = set()
            for project, service, container, image_id in expected:
                result = subprocess.run(['docker', 'inspect', container], capture_output=True, text=True)
                if result.returncode != 0:
                    issues.append(container + ': missing; inspect the preceding Compose startup output')
                    continue
                try:
                    info = json.loads(result.stdout)[0]
                    state = info.get('State', {})
                    networks = info.get('NetworkSettings', {}).get('Networks', {})
                    labels = info.get('Config', {}).get('Labels') or {}
                    allow_restart = (
                        container == 'ai_ingestion-v5.0.1.1.2'
                        and (state.get('Status') == 'restarting' or state.get('Restarting'))
                    )
                    if allow_restart:
                        allowed_restarting.add(container)
                        if not reported_ingestion_restart:
                            print('WARNING: ' + container + ': restarting is permitted while Azure Key Vault is being updated; ingestion is not confirmed ready.', flush=True)
                            reported_ingestion_restart = True
                    if (state.get('Status') != 'running' or state.get('Restarting')) and not allow_restart:
                        issues.append(container + ': state=' + str(state.get('Status')))
                    elif info.get('Image') != image_id:
                        issues.append(container + ': not using the image currently downloaded for this release')
                    elif labels.get('com.docker.compose.project') != project or labels.get('com.docker.compose.service') != service:
                        issues.append(container + ': Compose project/service does not match the deployment plan')
                    elif not allow_restart and ('ai_net' not in networks or not networks['ai_net'].get('IPAddress')):
                        issues.append(container + ': not attached to ai_net with an IPv4 address')
                except (ValueError, IndexError, TypeError, AttributeError):
                    issues.append(container + ': unable to read container inspection result')
            if not issues:
                for host in upstreams:
                    result = subprocess.run(
                        ['docker', 'exec', 'ai_nginx', 'getent', 'hosts', host],
                        capture_output=True, text=True, timeout=10,
                    )
                    if result.returncode != 0 or not result.stdout.strip():
                        issues.append('Nginx cannot resolve upstream: ' + host)
            if issues:
                stable_samples = 0
                if issues != last_issues:
                    print('Waiting for application startup / Docker DNS:', flush=True)
                    for issue in issues:
                        print('  ' + issue, flush=True)
                    last_issues = issues
            else:
                stable_samples += 1
                if stable_samples >= 3:
                    for _, _, container, _ in expected:
                        if container in allowed_restarting:
                            print(container + ': restarting permitted; downloaded image and Compose identity confirmed; network check deferred')
                        else:
                            print(container + ': running; downloaded image confirmed; ai_net attached')
                    print('Required startup checks passed; Nginx resolves every release upstream. Ingestion restarting is permitted pending Key Vault configuration.')
                    break
            if time.monotonic() >= deadline:
                raise SystemExit('Container startup/network verification timed out. Nginx configuration has NOT been changed. Review the first pull/start error and docker compose ps -a.')
            time.sleep(5)
        STARTUP_PY
        
        # Phase 5: Only now may the Nginx merge, validation, and restart begin.

        # Merge only the five location blocks into the existing HTTPS server.
        test -s .nginx-config.pending || { echo 'Staged NGINX_CONF_CONTENT is missing.'; false; }
        python3 - "$NGINX_CONF" .nginx-config.pending "$candidate" <<'PY'
        import re
        import sys
        from pathlib import Path
        
        source, snippets, output = map(Path, sys.argv[1:])
        text = source.read_text()
        blocks = snippets.read_text().strip()
        
        # Ignore comments and quoted strings when locating structural braces.
        def mask(value):
            pattern = r'''"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\#[^\n]*'''
            return re.sub(pattern, lambda m: ''.join('\n' if c == '\n' else ' ' for c in m.group()), value)
        
        def close_brace(value, opening):
            depth = 0
            for pos in range(opening, len(value)):
                if value[pos] == '{':
                    depth += 1
                elif value[pos] == '}':
                    depth -= 1
                    if depth == 0:
                        return pos
            raise SystemExit('Unbalanced Nginx braces; no changes made.')
        
        masked_blocks = mask(blocks)
        locations = []
        position = 0
        while position < len(blocks):
            match = re.search(r'\S', masked_blocks[position:])
            if not match:
                break
            first = position + match.start()
            location = re.match(r'location\s+(/v5\.0\.1\.1\.2/[^\s{]+)\s*\{', masked_blocks[first:])
            if not location:
                raise SystemExit('NGINX_CONF_CONTENT must contain only /v5.0.1.1.2/ location blocks, not a complete configuration.')
            opening = first + location.end() - 1
            last = close_brace(masked_blocks, opening) + 1
            locations.append((location.group(1), blocks[first:last]))
            position = last
        expected = {
            '/v5.0.1.1.2/AIExecution/',
            '/v5.0.1.1.2/AIExecution/analyze-image',
            '/v5.0.1.1.2/AIContentGeneration/',
            '/v5.0.1.1.2/AISmartGapAssessor/',
            '/v5.0.1.1.2/AISmartAuthor/',
        }
        if len(locations) != 5 or {path for path, _ in locations} != expected:
            raise SystemExit('Variable must contain exactly the five requested /v5.0.1.1.2/ location blocks.')
        
        masked = mask(text)
        servers = []
        for match in re.finditer(r'\bserver\s*\{', masked):
            opening = match.end() - 1
            closing = close_brace(masked, opening)
            body = masked[opening+1:closing]
            if re.search(r'\blisten\s+(?:\[::\]:|[0-9.]+:)?443\b', body):
                servers.append((opening, closing))
        if len(servers) != 1:
            raise SystemExit('Expected exactly one HTTPS server block; no changes made.')
        opening, closing = servers[0]
        body = text[opening+1:closing]
        
        # Support the release markers used by earlier workflow versions.
        begin = '    # BEGIN GITHUB ACTIONS VLMS v50112'
        end = '    # END GITHUB ACTIONS VLMS v50112'
        if text.count(begin) != text.count(end) or text.count(begin) > 1:
            raise SystemExit('Ambiguous release markers; no changes made.')
        if begin in text:
            if begin not in body or end not in body or body.index(end) < body.index(begin):
                raise SystemExit('Release markers must be inside the HTTPS server.')
            first, last = body.index(begin), body.index(end)+len(end)
            replacement = begin+'\n'+'\n\n'.join('    '+block for _, block in locations)+'\n'+end
            outside = body[:first]+body[last:]
            if re.search(r'\blocation\s+/v5\.0\.1\.1\.2/', mask(outside)):
                raise SystemExit('Duplicate unmanaged release locations; no changes made.')
            new_body = body[:first]+replacement+body[last:]
        else:
            masked_body = mask(body)
            edits = []
            missing = []
            for path, block in locations:
                matches = list(re.finditer(r'\blocation\s+'+re.escape(path)+r'\s*\{', masked_body))
                if len(matches) > 1:
                    raise SystemExit('Duplicate existing location: '+path)
                if matches:
                    match = matches[0]
                    last = close_brace(masked_body, match.end()-1)+1
                    edits.append((match.start(), last, block))
                else:
                    missing.append('    '+block)
            if missing:
                anchor = re.search(r'(?m)^\s*error_page\s+404\s+/index\.html;', masked_body)
                insertion = anchor.start() if anchor else len(body)
                edits.append((insertion, insertion, '\n'+'\n\n'.join(missing)+'\n\n'))
            new_body = body
            for first, last, replacement in sorted(edits, reverse=True):
                new_body = new_body[:first]+replacement+new_body[last:]
        
        output.write_text(text[:opening+1]+new_body+text[closing:])
        PY
        rm -f .nginx-config.pending
        
        # Read the DNS from the current configuration instead of hardcoding it.
        DNS=$(python3 - "$candidate" <<'PY'
        import re, sys
        from pathlib import Path
        text = re.sub(r'#[^\n]*', '', Path(sys.argv[1]).read_text())
        names = re.findall(r'\bserver_name\s+([^;]+);', text)
        hosts = {name for group in names for name in group.split()
                 if name != '_' and re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9.-]*', name)}
        if len(hosts) != 1:
            raise SystemExit('Expected one DNS hostname in nginx.conf; found multiple or none.')
        print(hosts.pop())
        PY
        )

        cp -p "$NGINX_CONF" "$backup"
        changed=true
        # Do not replace the inode: Docker mounts this individual file.
        cat "$candidate" > "$NGINX_CONF"
        docker exec "$NGINX_CONTAINER" nginx -t
        docker restart "$NGINX_CONTAINER"

        nginx_ready=false
        for attempt in {1..15}; do
          if [ "$(docker inspect --format '{{.State.Running}}' "$NGINX_CONTAINER" 2>/dev/null)" = true ] &&
             docker exec "$NGINX_CONTAINER" nginx -t; then
            nginx_ready=true
            break
          fi
          sleep 2
        done
        "$nginx_ready" || { echo 'Nginx did not restart successfully.'; false; }

        echo 'Nginx restarted successfully. Waiting 60 seconds before readiness checks.'
        sleep 60

        # Verify only the four requested application readiness URLs.
        # DNS comes from nginx.conf. Redirects are NOT counted as ready.
        paths=(
          /v5.0.1.1.2/AIContentGeneration/ready
          /v5.0.1.1.2/AISmartAuthor/ready
          /v5.0.1.1.2/AIExecution/ready
          /v5.0.1.1.2/AISmartGapAssessor/ready
        )
        failed=0
        for path in "${paths[@]}"; do
          url="https://${DNS}${path}"
          passed=false
          for attempt in {1..12}; do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --connect-timeout 5 --max-time 10 "$url") || code=000
            if [ "$code" = 200 ]; then passed=true; break; fi
            sleep 3
          done
          echo "$url -> HTTP $code"
          if ! "$passed"; then failed=1; fi
        done
        if [ "$failed" -ne 0 ]; then
          echo 'Readiness failed: verify routes, DNS/TLS, authentication, and application readiness.'
          false
        fi

        echo "Deployment and HTTP readiness checks passed. Nginx backup: $backup"
        REMOTE
    - name: Remove SSH credentials
      if: always()
      shell: bash
      run: |
        rm -f "$HOME/.ssh/deploy_key" "$HOME/.ssh/config" "$HOME/.ssh/known_hosts"
