
services:
  ai_content_generation_v5.0.1.1.2:
    image: vgvalcontainer.azurecr.io/content-generation-api:1.0.0.alpha.31
    container_name: ai_content_generation-v5.0.1.1.2
    platform: linux/amd64
    env_file:
      - ./.env
    volumes:
      - /AI-DATA:/mnt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "200m"
        max-file: "5"
    networks:
      - ai_net

networks:
  ai_net:
    name: ai_net
    external: true
