services:
  ai_ingestion_v5.0.1.1.2:
    image: vgvalcontainer.azurecr.io/document-ingestion:2.0.4
    container_name: ai_ingestion-v5.0.1.1.2
    platform: linux/amd64
    env_file:
      - ./.env
    volumes:
      - /AI-DATA:/mnt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "200m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G
    networks:
      - ai_net

networks:
  ai_net:
    name: ai_net
    external: true
